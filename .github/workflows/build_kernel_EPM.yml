- name: Build Kernel EPM Version
      run: |
         sudo ln -sf /usr/bin/python2.7 /usr/bin/python
         if [ -d include/config ];
          then
           echo "Find config,will remove it"
           rm -rf include/config
         else
          echo "No Config,good."
         fi
         
         echo "[*] Manually Injecting KernelSU v0.9.5..."
         # Clean up any leftover folders
         rm -rf drivers/kernelsu KernelSU
         
         # Clone EXACTLY v0.9.5 directly (bypassing setup.sh)
         git clone --depth 1 --branch v0.9.5 https://github.com/tiann/KernelSU.git KernelSU
         
         # Link the kernel folder to where the Huawei config expects it
         ln -sf ../../KernelSU/kernel drivers/kernelsu
         
         export ARCH=arm64
         export PATH=$PATH:/aarch64-linux-android-4.9/bin
         export CROSS_COMPILE=aarch64-linux-android-
         make ARCH=arm64 O=out merge_kirin980_defconfig
         make ARCH=arm64 O=out -j$(nproc --all)

         tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz --base 0x0 --cmdline "loglevel=4 initcall_debug=n page_tracker=on unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive buildvariant=user" --tags_offset 0x07A00000 --kernel_offset 0x00080000 --ramdisk_offset 0x07C00000 --header_version 1 --os_version 9 --os_patch_level 2020-01-01  --output Kirin970_Ravel_KSU_9.1.0_PM-EPM-${{ steps.get_time.outputs.TIME }}.img
