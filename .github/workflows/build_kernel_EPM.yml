name: Build Huawei-Kirin980-EMUI9.1.0-KSU-Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- O=out"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y 
          sudo apt install binutils make python2 libssl-dev flex unzip ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs bc bison build-essential ccache curl g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev adb fastboot -y
          
      - name: GetTime
        id: get_time
        run: |
          echo "TIME=$(TZ=UTC-8 date +%m%d%H%M )" >> $GITHUB_OUTPUT
    
      - name: Build Kernel EPM Version
        run: |
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          if [ -d include/config ]; then
            echo "Find config,will remove it"
            rm -rf include/config
          else
            echo "No Config,good."
          fi
          
          echo "[*] Manually Injecting KernelSU v0.9.5..."
          rm -rf drivers/kernelsu KernelSU
          git clone --depth 1 --branch v0.9.5 https://github.com/tiann/KernelSU.git KernelSU
          cp -r KernelSU/kernel drivers/kernelsu
          
          export ARCH=arm64
          export PATH=$PATH:/aarch64-linux-android-4.9/bin
          export CROSS_COMPILE=aarch64-linux-android-
          export KSU_GIT_VERSION="v0.9.5"
          export HOSTCFLAGS="-fcommon -fPIC"
          export HOSTLDFLAGS="-fcommon"
          
          make ARCH=arm64 O=out merge_kirin980_defconfig HOSTCC="gcc -fcommon"
          make ARCH=arm64 O=out -j$(nproc --all) HOSTCC="gcc -fcommon"

          tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz --base 0x0 --cmdline "loglevel=4 initcall_debug=n page_tracker=on unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive buildvariant=user" --tags_offset 0x07A00000 --kernel_offset 0x00080000 --ramdisk_offset 0x07C00000 --header_version 1 --os_version 9 --os_patch_level 2020-01-01  --output Kirin980_KSU_9.1.0_PM-EPM-${{ steps.get_time.outputs.TIME }}.img
    
      - name: Upload Ravel-KSU-Kernel-EPM
        uses: actions/upload-artifact@v4
        with:
          name: Kirin980_KSU_9.1.0-EPM-${{ steps.get_time.outputs.TIME }}
          path: "Kirin980_KSU_9.1.0_PM-EPM-${{ steps.get_time.outputs.TIME }}.img"
